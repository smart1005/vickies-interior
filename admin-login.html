<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Vickie's Interior</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --gold: #C9A84C;
    --dark: #0D0D0D;
    --border: rgba(201,168,76,0.2);
  }
  body {
    font-family: 'Jost', sans-serif;
    background: var(--dark);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image: radial-gradient(ellipse at center, rgba(201,168,76,0.08) 0%, transparent 70%);
  }
  .login-box {
    background: #111;
    border: 1px solid var(--border);
    padding: 60px 48px;
    width: 100%;
    max-width: 440px;
    text-align: center;
  }
  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem; font-weight: 300;
    color: #fff; letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .logo span { color: var(--gold); font-style: italic; }
  .login-subtitle {
    font-size: 0.65rem; letter-spacing: 4px; text-transform: uppercase;
    color: rgba(255,255,255,0.3); margin-bottom: 48px;
  }
  .form-group { margin-bottom: 16px; text-align: left; }
  .form-group label {
    font-size: 0.62rem; letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold); display: block; margin-bottom: 8px;
  }
  .form-group input {
    width: 100%; background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    padding: 14px 16px; color: #fff;
    font-family: 'Jost', sans-serif; font-size: 0.9rem;
    outline: none; transition: border-color 0.3s;
  }
  .form-group input:focus { border-color: var(--gold); }
  .form-group input::placeholder { color: rgba(255,255,255,0.25); }
  .login-btn {
    width: 100%; background: var(--gold); color: #fff; border: none;
    padding: 16px; font-family: 'Jost', sans-serif;
    font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase;
    cursor: pointer; transition: all 0.3s; margin-top: 8px;
  }
  .login-btn:hover { background: #d4af5a; }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .error-msg {
    background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
    color: #ef4444; padding: 12px 16px;
    font-size: 0.78rem; margin-bottom: 16px; display: none;
    text-align: left;
  }
  .back-link {
    display: block; margin-top: 24px;
    font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(255,255,255,0.3); text-decoration: none;
    transition: color 0.3s;
  }
  .back-link:hover { color: var(--gold); }
</style>
</head>
<body>

<div class="login-box">
  <div class="logo">Vickie's <span>Interior</span></div>
  <p class="login-subtitle">Admin Portal</p>

  <div class="error-msg" id="errorMsg"></div>

  <div class="form-group">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="Enter your email">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter your password">
  </div>
  <button class="login-btn" id="loginBtn" onclick="login()">Sign In to Dashboard</button>
  <a href="index.html" class="back-link">← Back to Website</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCJVBOoq8rzmP1D_JO9_v-1wMHYOdJ0Auo",
    authDomain: "vikies-interior.firebaseapp.com",
    projectId: "vikies-interior",
    storageBucket: "vikies-interior.firebasestorage.app",
    messagingSenderId: "812115483821",
    appId: "1:812115483821:web:a3b262a145713338597a24"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // If already logged in go straight to dashboard
  auth.onAuthStateChanged((user) => {
    if (user) window.location.href = 'admin-dashboard.html';
  });

  window.login = async function() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');

    if (!email || !password) {
      errorMsg.textContent = 'Please enter your email and password.';
      errorMsg.style.display = 'block';
      return;
    }

    btn.textContent = 'Signing in...';
    btn.disabled = true;
    errorMsg.style.display = 'none';

    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = 'admin-dashboard.html';
    } catch (error) {
      btn.textContent = 'Sign In to Dashboard';
      btn.disabled = false;
      errorMsg.textContent = 'Invalid email or password. Please try again.';
      errorMsg.style.display = 'block';
    }
  }

  // Allow Enter key to submit
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') window.login();
  });
</script>

</body>
</html>
